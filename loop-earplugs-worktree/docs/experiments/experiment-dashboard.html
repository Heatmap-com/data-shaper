<!doctype html>
<!--
  Experiment Intelligence — vision and dashboard mock.
  Companion to docs/experiments/EXPERIMENT-INTELLIGENCE.md (vision, requirements, data contract, market brief).

  What this file is:
    A standalone, dependency-free mock of the experiment analysis dashboard and the planning flow.
    All numbers are illustrative. They are embedded as JSON in <script id="experiment-data"> so a reader
    (human or LLM) can parse the exact data behind every chart. Every statistic shown is computed in the
    browser from those counts with the formulas the requirements specify (two-proportion z-test, Holm and
    Benjamini–Hochberg corrections, Cochran's Q heterogeneity, delta-method confidence intervals,
    log decomposition of revenue-per-visit lift, sample-size estimates).

  Views:
    Vision    — goals G1–G4, architecture, the four definition conditions, causal classes, requirements board.
    Dashboard — experiment list and tabs: Insights, Site, Segments, Page, Funnel, Journeys, Sections,
                Elements, Plan, Data (the flat machine-readable readout rows, exportable as JSONL).
-->

  rateRow("site", "site", "assigned", "cvr", at.b, at.s, ac.b, ac.s);
  push({ level: "site", entity_key: "site", basis: "assigned", metric: "rpv", value: r4(at.r / at.s), control_value: r4(ac.r / ac.s), n: at.s, n_control: ac.s, lift_rel: r4(rel(at.r / at.s, ac.r / ac.s)), p_value: exp.rpv_p });
  push({ level: "site", entity_key: "site", basis: "assigned", metric: "aov", value: r4(at.r / at.b), control_value: r4(ac.r / ac.b), n: at.b, n_control: ac.b, lift_rel: r4(rel(at.r / at.b, ac.r / ac.b)) });
  if (exp.exposed) { const [ec, et] = exp.exposed; rateRow("site", "site", "exposed", "cvr", et.b, et.s, ec.b, ec.s, { causal_class: "conditionally_causal" }); }
  for (const s of segmentAnalysis(exp).rows) {
    push({ level: "segment", entity_key: "site", basis: "assigned", metric: "cvr", segment: s.strategy, segment_value: s.value, segment_planned: s.planned ? 1 : 0, value: r4(s.t.b / s.t.s), control_value: r4(s.c.b / s.c.s), n: s.t.s, n_control: s.c.s, lift_rel: r4(s.test.lift), ci_low_rel: r4(s.test.lo), ci_high_rel: r4(s.test.hi), p_value: r6(s.test.p), p_adjusted: r6(s.adj), correction: s.correction });
  }
  for (const pg of exp.pages) rateRow("page", String(pg.id), "exposed", "cvr", pg.cells[1].b, pg.cells[1].s, pg.cells[0].b, pg.cells[0].s, { entity_label: pg.path, causal_class: "conditionally_causal" });
  const fa = funnelAnalysis(exp);
  fa.transitions.forEach((t) => {
    const key = `step:${t.to.toLowerCase().replace(/[^a-z]+/g, "_")}`;
    rateRow("funnel", key, "funnel_step", "reach", fa.reach[1][t.i], fa.reach[1][0], fa.reach[0][t.i], fa.reach[0][0], { entity_label: t.to });
    rateRow("funnel", key, "funnel_step", "continuation", fa.reach[1][t.i], fa.reach[1][t.i - 1], fa.reach[0][t.i], fa.reach[0][t.i - 1], { entity_label: t.to });
  });
  fa.contributions.forEach((c) => push({ level: "funnel", entity_key: `factor:${c.label.toLowerCase().replace(/[^a-z]+/g, "_")}`, entity_label: c.label, basis: "assigned", metric: "rpv_lift_contribution", value: Math.round(c.value * 100) / 100 }));
  if (exp.journey) {
    const j = exp.journey;
    const tot = j.clusters.reduce((a, cl) => [a[0] + cl.s[0], a[1] + cl.s[1]], [0, 0]);
    j.clusters.forEach((cl) => {
      const key = `next:${cl.page.toLowerCase().replace(/[^a-z]+/g, "_")}`;
      rateRow("journey", key, "exposed", "next_page_share", cl.s[1], tot[1], cl.s[0], tot[0], { entity_label: `${j.entry} → ${cl.page}`, causal_class: "conditionally_causal" });
      if (cl.b[0] + cl.b[1] > 0) rateRow("journey", key, "path", "path_cvr", cl.b[1], cl.s[1], cl.b[0], cl.s[0], { entity_label: `${j.entry} → ${cl.page}` });
    });
    j.flags.forEach((f) => rateRow("journey", `flag:${f.flag}`, "exposed", "journey_flag_rate", f.count[1], tot[1], f.count[0], tot[0], { entity_label: f.label }));
    const na = j.next_after, cl0 = na.counts[0].reduce((a, b) => a + b, 0), cl1 = na.counts[1].reduce((a, b) => a + b, 0);
    na.dest.forEach((d, i) => rateRow("journey", `role:${na.role}>${d.toLowerCase().replace(/[^a-z]+/g, "_")}`, "clicked", "next_after_click_share", na.counts[1][i], cl1, na.counts[0][i], cl0, { entity_label: `${na.label} → ${d}` }));
  }
  const sa = sectionAnalysis(exp);
  push({ level: "section", entity_key: "captured", basis: "assigned", metric: "capture_rate", value: r4(exp.captured[1] / at.s), control_value: r4(exp.captured[0] / ac.s), n: at.s, n_control: ac.s, lift_rel: r4(sa.capTest.lift), p_value: r6(sa.capTest.p), quality_flags: sa.balanced ? [] : ["capture_imbalance"] });
  sa.rows.forEach(({ s, comparable }) => {
    const flags = ["sample_section_tracker"].concat(sa.balanced ? [] : ["capture_imbalance"]);
    rateRow("section", s.section, "section_captured", "seen_rate", s.seen[1], exp.captured[1], s.seen[0], exp.captured[0], { entity_role: s.role || "", comparable: sa.balanced ? 1 : 0, quality_flags: flags });
    rateRow("section", s.section, "section_captured", "section_click_rate", s.clicked[1], exp.captured[1], s.clicked[0], exp.captured[0], { entity_role: s.role || "", comparable: sa.balanced ? 1 : 0, quality_flags: flags });
    rateRow("section", s.section, "section_seen", "seen_cvr", s.seen_b[1], s.seen[1], s.seen_b[0], s.seen[0], { entity_role: s.role || "", comparable: comparable ? 1 : 0, quality_flags: flags });
  });
  for (const e of exp.elements) {
    const single = e.only_arm != null || e.clickers[0] === 0;
    rateRow("element", e.selector, "assigned", "click_rate", e.clickers[1], at.s, e.clickers[0], ac.s, { entity_label: e.name || "", element_class: e.cls || "", section: e.section, comparable: single ? 0 : 1, quality_flags: single ? ["single_arm_element"] : [] });
  }
  for (const rp of rolePairs(exp)) {
    rateRow("element", `role:${rp.role}`, "assigned", "click_rate", rp.clickers[1], at.s, rp.clickers[0], ac.s, { entity_label: rp.role, entity_role: "treated" });
    rateRow("element", `role:${rp.role}`, "clicked", "clicked_cvr", rp.buyers[1], rp.clickers[1], rp.buyers[0], rp.clickers[0], { entity_label: rp.role });
  }
  return rows.map((r) => ({ ...r, row_key: [r.level, r.entity_key, r.basis, r.metric, r.arm, `${r.segment}:${r.segment_value}`].join("|") }));
}

// ------------------------------------------------------------------ insights (rules over readout rows)
function buildInsights(exp) {
  const out = [];
  const readout = buildReadout(exp);
  const find = (pred) => readout.filter(pred).map((r) => r.row_key);
  const variant = exp.arms.find((a) => !a.control);
  const [ac, at] = exp.assigned;
  const a0 = exp.arms[0].alloc;
  const srm = srmP(ac.s, at.s, a0 ?? 0.5);
  out.push(srm < 0.01
    ? { sev: "health", rule: "health.srm", title: "Assignment split is off", finding: `The split differs from ${a0 == null ? "an assumed" : "the declared"} 50/50 (SRM p ${pfmt(srm)}). Results are unreliable until the cause is found.`, evidence: [] }
    : { sev: "info", rule: "health.srm", title: "Assignment split is healthy", finding: `SRM p ${pfmt(srm)} against ${a0 == null ? "an assumed (no plan)" : "the declared"} 50/50 split.`, evidence: [] });
  const sa = sectionAnalysis(exp);
  if (!sa.balanced) out.push({ sev: "health", rule: "health.capture_imbalance", title: "Section data sampled the arms unequally", finding: `Section capture ${pct(exp.captured[0] / ac.s, 2)} vs ${pct(exp.captured[1] / at.s, 2)} (p ${pfmt(sa.capTest.p)}). Section seen and click rates, and seen-visitor outcomes, are not comparable between arms.`, evidence: find((r) => r.metric === "capture_rate") });
  const cvr = twoProp(at.b, at.s, ac.b, ac.s);
  const rpvL = at.r / at.s / (ac.r / ac.s) - 1;
  out.push({ sev: (exp.rpv_p ?? 1) < 0.05 ? "effect" : "info", rule: "effect.headline", title: `${variant.label}: revenue per visit ${signed(rpvL)}`, finding: `RPV ${money(ac.r / ac.s)} → ${money(at.r / at.s)} (p ${pfmt(exp.rpv_p)}); conversion ${pct(ac.b / ac.s, 2)} → ${pct(at.b / at.s, 2)} (${signed(cvr.lift)}, p ${pfmt(cvr.p)}). ${(exp.rpv_p ?? 1) < 0.05 ? "Significant." : exp.status === "running" ? "Not yet significant; keep running to the planned end." : "Not significant."}`, evidence: find((r) => r.level === "site" && r.basis === "assigned") });
  const fa = funnelAnalysis(exp);
  if (fa.biggest) {
    const contrib = fa.contributions.find((c) => c.label === `${short(fa.biggest.from)} → ${short(fa.biggest.to)}`);
    out.push({ sev: "locate", rule: "locate.funnel_step", title: `The change happens at ${short(fa.biggest.from)} → ${short(fa.biggest.to)}`, finding: `Continuation ${pct(fa.biggest.cont[0])} → ${pct(fa.biggest.cont[1])} (${signed(fa.biggest.test.lift)}, p ${pfmt(fa.biggest.test.p)}). It accounts for ${contrib ? contrib.value.toFixed(1) : "—"} pp of the ${signed(fa.total - 1)} funnel-path RPV lift; other steps are within noise.`, evidence: find((r) => r.level === "funnel" && r.entity_label === fa.biggest.to) });
  }
  if (sa.balanced) {
    for (const r of sa.rows) {
      if (r.s.role === "treated" && (r.clickT.p ?? 1) < 0.05) out.push({ sev: "locate", rule: "locate.zone", title: `Treated zone ${r.s.section}: click rate ${signed(r.clickT.lift)}`, finding: `Visits clicking inside the zone ${pct(r.clickT.p0)} → ${pct(r.clickT.p1)} of captured visits (p ${pfmt(r.clickT.p)}). Seen rate ${signed(r.seenT.lift)} (p ${pfmt(r.seenT.p)}).`, evidence: find((x) => x.level === "section" && x.entity_key === r.s.section) });
      if (r.s.role !== "treated" && ((r.seenT.p ?? 1) < 0.05 && r.seenT.lift < 0 || (r.clickT.p ?? 1) < 0.05 && r.clickT.lift < 0)) out.push({ sev: "warn", rule: "guardrail.regression", title: `${r.s.role === "guardrail" ? "Guardrail" : "Untreated"} zone ${r.s.section} regressed`, finding: `Seen rate ${pct(r.seenT.p0)} → ${pct(r.seenT.p1)} (${signed(r.seenT.lift)}, p ${pfmt(r.seenT.p)}); click rate ${signed(r.clickT.lift)} (p ${pfmt(r.clickT.p)}). Fewer visitors reach it, which suggests the change above it pushed it down the page.`, evidence: find((x) => x.level === "section" && x.entity_key === r.s.section) });
    }
  }
  for (const rp of rolePairs(exp)) {
    if ((rp.test.p ?? 1) < 0.05) out.push({ sev: "locate", rule: "locate.element_role", title: `Role ${rp.role}: click rate ${signed(rp.test.lift)}`, finding: `${pct(rp.test.p0)} → ${pct(rp.test.p1)} of all assigned visits clicked it (p ${pfmt(rp.test.p)}). The role pairs ${rp.members.map((m) => `<code>${esc(m.selector.split(" ").slice(-3).join(" "))}</code>`).join(" and ")}. Clicker conversion ${pct(rp.cvr[0])} → ${pct(rp.cvr[1])} (descriptive).`, evidence: find((r) => r.entity_key === `role:${rp.role}`) });
  }
  for (const e of exp.elements) {
    if (e.not_link && e.clickers[1] > 0) out.push({ sev: "warn", rule: "element.dead_click", title: `${e.name} draws clicks but is not a link`, finding: `${pct(e.clickers[1] / at.s)} of variant visits clicked it, ${(e.clicks[1] / e.clickers[1]).toFixed(2)} clicks per clicker: it looks clickable.`, evidence: find((r) => r.entity_key === e.selector) });
  }
  if (exp.elements.some((e) => e.clickers[0] === 0 && !e.role && e.clickers[1] > 0)) {
    const added = exp.elements.find((e) => e.clickers[0] === 0 && !e.role);
    const lost = exp.elements.filter((e) => e.clickers[0] > e.clickers[1] * 1.2);
    if (added && lost.length) out.push({ sev: "locate", rule: "element.cannibalization", title: "New element took over an existing one's clicks", finding: `<code>${esc(added.selector)}</code> appears only in the variant (${int(added.clickers[1])} clicking visits) while <code>${esc(lost[0].selector.split(" ").slice(-2).join(" "))}</code> fell ${pct(1 - lost[0].clickers[1] / lost[0].clickers[0])}. Without a role pairing these cannot be compared directly.`, evidence: find((r) => r.level === "element") });
  }
  const seg = segmentAnalysis(exp);
  const plannedRows = seg.rows.filter((r) => r.planned);
  if (plannedRows.length) {
    const best = [...plannedRows].sort((a, b) => b.test.lift - a.test.lift)[0];
    const het = seg.het.find((h) => h.strategy === best.strategy);
    const sigAdj = plannedRows.filter((r) => r.adj < 0.05);
    out.push({ sev: sigAdj.length ? "effect" : "info", rule: "segment.heterogeneity", title: sigAdj.length ? `Planned segments with a confirmed effect: ${sigAdj.map((r) => `${r.value}`).join(", ")}` : `No planned segment confirmed after correction`, finding: `Largest planned lift: ${best.label} = ${best.value}, ${signed(best.test.lift)} (nominal p ${pfmt(best.test.p)}, Holm-adjusted ${pfmt(best.adj)}). Heterogeneity across ${best.label.toLowerCase()} values: p ${pfmt(het.p)}${het.p < 0.05 ? ", so the effect differs by segment" : ", so the difference between segments is not established; treat it as a hypothesis"}.`, evidence: find((r) => r.level === "segment" && r.segment === best.strategy) });
  } else {
    out.push({ sev: "warn", rule: "segment.unplanned", title: "No planned segments", finding: "Every segment cut is exploratory and corrected with Benjamini–Hochberg. Declare segments in the plan next time to get confirmatory reads.", evidence: [] });
  }
  if (exp.journey) {
    const j = exp.journey, na = j.next_after;
    const ci = na.dest.indexOf("Collection");
    const c0 = na.counts[0].reduce((a, b) => a + b, 0), c1 = na.counts[1].reduce((a, b) => a + b, 0);
    const t = twoProp(na.counts[1][ci], c1, na.counts[0][ci], c0);
    const tot = j.clusters.reduce((a, cl) => [a[0] + cl.s[0], a[1] + cl.s[1]], [0, 0]);
    const bounce = j.clusters.find((cl) => cl.page.startsWith("Exit"));
    const bt = twoProp(bounce.s[1], tot[1], bounce.s[0], tot[0]);
    out.push({ sev: "locate", rule: "journey.redirect", title: `${na.label} clickers land on collections more often`, finding: `${pct(t.p0)} → ${pct(t.p1)} went to a collection next (p ${pfmt(t.p)}). Bounce after ${j.entry.toLowerCase()} ${pct(bt.p0)} → ${pct(bt.p1)} (p ${pfmt(bt.p)}).`, evidence: find((r) => r.level === "journey" && (r.entity_key.startsWith(`role:${na.role}`) || r.entity_key.startsWith("next:exit"))) });
  }
  if (exp.planned_end) {
    const shortfalls = feasibility(exp, 0.1, 0.05, 0.8).filter((f) => f.status !== "feasible");
    if (shortfalls.length) out.push({ sev: "warn", rule: "health.underpowered", title: `${shortfalls.length} planned segment${shortfalls.length > 1 ? "s" : ""} cannot reach ${shortfalls.length > 1 ? "their" : "its"} MDE by the planned end`, finding: shortfalls.map((f) => `${f.label}: ${f.status} (${Math.round(f.mde * 100)}% MDE needs ${int(f.n)} visits per arm at a ${pct(f.p, 2)} baseline)`).join("; ") + ". The plan flagged this before launch; read these segments as directional.", evidence: [] });
  }
  out.push({ sev: "effect", rule: "next_test", title: "Recommended next steps", finding: `<ul style="margin:0;padding-left:18px">${exp.next_test.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>`, evidence: [] });
  return out;
}

// ------------------------------------------------------------------ state and views
const state = { view: "vision", exp: EXPS[0].key, tab: "Insights", mde: 0.1, alpha: 0.05, power: 0.8, showExpl: true, dataLevel: "all", reqArea: "all", reqStatus: "all" };
const current = () => EXPS.find((e) => e.key === state.exp) || EXPS[0];

function tabsFor(exp) {
  return ["Insights", "Site", "Segments", ...(exp.pages.length ? ["Page"] : []), "Funnel", ...(exp.journey ? ["Journeys"] : []), "Sections", "Elements", "Plan", "Data"];
}

function viewVision() {
  const counts = { Built: 0, Partial: 0, Proposed: 0 };
  DATA.requirements.forEach((r) => counts[r.status]++);
  const areas = [...new Set(DATA.requirements.map((r) => r.area))];
  const filtered = DATA.requirements.filter((r) => (state.reqArea === "all" || r.area === state.reqArea) && (state.reqStatus === "all" || r.status === state.reqStatus));
  const goal = (g, title, body, tabs) => `<div class="card goal stack tight"><p class="small muted"><b>${g}</b></p><h3>${title}</h3><p class="small">${body}</p><div class="row">${tabs.map((t) => `<button class="pill sm" data-action="goto" data-tab="${t}">${t}</button>`).join("")}</div></div>`;
  return `
  <div class="stack" style="gap:28px">
    <div class="stack tight" style="max-width:880px">
      <h2>Know where your test made money</h2>
      <p>Experiment Intelligence reads the A/B tests a merchant already runs in their testing tool (Shoplift, Intelligems, ABConvert and similar) and shows each arm against control at six levels: <b>site, user journey, funnel, page, section (rollup zone) and element</b>, with revenue attached. The user defines the experiment, its zones and elements, and the segments that matter <b>inside the Heatmap extension's side-by-side A/B comparison view</b>, before results arrive. Every outcome is also published as flat, normalized, machine-readable rows, so the site-analysis engine and AI analysts can turn each test into the next hypothesis.</p>
    </div>
    <div class="grid4">
      ${goal("G1", "Revenue attribution at every level", "Site, journey, funnel, page, section and element views, each comparing every arm to control with conversion, revenue per visit, and the right statistical test. Each metric is labelled causal or descriptive.", ["Site", "Funnel", "Journeys", "Sections", "Elements"])}
      ${goal("G2", "Machine-readable outcomes", "One metric per row, canonical identities (arms, theme-independent selectors, section names, roles), one segmentation vector per row, additive counts, provenance. Ready for LLMs, BI and MCP.", ["Data"])}
      ${goal("G3", "Segments declared when planning", "Pick the segments that matter before launch, with an expected direction and minimum detectable effect. See whether each can be detected by the planned end. Planned segments get Holm correction; everything else is labelled exploratory.", ["Plan", "Segments"])}
      ${goal("G4", "Insights for the site-analysis tool", "Rules read the readout rows and produce findings with evidence: where the lift came from, which guardrail regressed, which segment drove it, what to test next.", ["Insights"])}
    </div>
    <div class="stack tight">
      <h2>How it fits together</h2>
      ${archDiagram()}
      ${caption("The plan is the contract between the extension and the engine. The flat readout is the contract between the engine and every reader.")}
    </div>
    <div class="grid2">
      <div class="stack tight">
        <h3>The definition, and what each part adds</h3>
        ${table(["Condition", "What it adds"], [
          ["Experiment descriptor (created in A/B comparison mode)", "Hypothesis, labels, declared allocation (SRM), primary metric, guardrails, planned end. Without it, the engine still infers arms, dates and scope from tags."],
          ["Page under test", "Exposed basis, per-page readout, the funnel's first step, the journey's entry page."],
          ["Rollup zone (a flagged container)", "The zone is always reported with its role, published to the tracker for seen data, and imaged in both arms."],
          ["Elements, paired by role across arms", "Role-paired comparison when the element differs per arm, plus the next page after the click and dead-click checks."],
          ["Planned segments", "Confirmatory segment readout with corrections and feasibility before launch."],
        ])}
      </div>
      <div class="stack tight">
        <h3>Causal classes (every metric carries one)</h3>
        ${table(["Class", "Meaning", "Examples"], [
          ["<b>causal</b>", "Base fixed before treatment; a difference is an effect", "RPV, CVR, funnel reach, element click rate per assigned visit"],
          ["<b>conditionally causal</b>", "Pre-treatment subset, balance-tested", "Exposed visits, section rates when capture is balanced"],
          ["<b>descriptive</b>", "Base selected by post-treatment behavior", "Clicker conversion, seen-visitor conversion, step continuation, path CVR"],
        ])}
        <p class="caption">Segments are only allowed on attributes known before assignment (device, source, geography, new or returning, landing). Post-assignment behavior is an outcome, never a segment (R-SEG-1).</p>
      </div>
    </div>
    <div class="stack tight">
      <div class="panel-head">
        <div class="stack tight"><h2>Requirements board</h2><p class="small muted">${DATA.requirements.length} requirements · <span class="st-Built st">${counts.Built} built</span> · <span class="st-Partial st">${counts.Partial} partial</span> · <span class="st-Proposed st">${counts.Proposed} proposed</span>. IDs match the narrative document.</p></div>
        <div class="row">
          <select data-action="req-area"><option value="all">All areas</option>${areas.map((a) => `<option ${state.reqArea === a ? "selected" : ""}>${a}</option>`).join("")}</select>
          <select data-action="req-status"><option value="all">All statuses</option>${["Built", "Partial", "Proposed"].map((s) => `<option ${state.reqStatus === s ? "selected" : ""}>${s}</option>`).join("")}</select>
        </div>
      </div>
      ${table(["ID", "Area", "Requirement", "Status"], filtered.map((r) => [`<code>${r.id}</code>`, r.area, esc(r.title), `<span class="st st-${r.status}">${r.status}</span>`]))}
    </div>
    <div class="callout">Switch to <b>Dashboard</b> to see the hypothetical hero-CTA experiment end to end. Every screen lists the requirements it depends on, and the <b>Data</b> tab shows the exact rows an AI analyst would read.</div>

}
function archDiagram() {
  const boxes = [
    { x: 10, t: "1 · Plan", s: ["Chrome extension", "A/B comparison mode", "zones, elements, roles,", "planned segments"] },
    { x: 250, t: "2 · Capture", s: ["Heatmap tracker", "clicks, journeys, orders,", "section visibility"] },
    { x: 490, t: "3 · Measure", s: ["Analysis engine", "normalize tags → arms", "facts + readouts + stats", "insight rules"] },
    { x: 730, t: "4 · Read", s: ["Dashboard · extension", "site-analysis engine", "LLMs via MCP / JSONL"] },
  ];
  let svg = "";
  boxes.forEach((b, i) => {
    svg += `<rect x="${b.x}" y="10" width="210" height="104" rx="6" fill="var(--bg2)" stroke="var(--border2)"/>`;
    svg += `<text x="${b.x + 14}" y="34" font-size="13" font-weight="600" fill="var(--fg)">${b.t}</text>`;
    b.s.forEach((line, k) => { svg += `<text x="${b.x + 14}" y="${54 + k * 15}" font-size="11" fill="var(--fg2)">${line}</text>`; });
    if (i < boxes.length - 1) svg += `<path d="M${b.x + 214},62 L${b.x + 244},62" stroke="var(--accent)" stroke-width="2" marker-end="url(#arr)"/>`;
  });
  svg += `<path d="M115,118 C115,150 595,150 595,118" fill="none" stroke="var(--fg3)" stroke-dasharray="4 3" marker-end="url(#arr2)"/>`;
  svg += `<text x="355" y="164" font-size="10" text-anchor="middle" fill="var(--fg3)">experiment-v1 package to the engine (hypothesis, page, arms, zones, elements + roles, segments, MDE); zones also go to the tracker</text>`;
  return `<svg viewBox="0 0 950 170" width="100%" role="img" aria-label="architecture"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker><marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--fg3)"/></marker></defs>${svg}</svg>`;
}

function viewDashboard() {
  const exp = current();
  const tabs = tabsFor(exp);
  if (!tabs.includes(state.tab)) state.tab = "Insights";
  const list = table(["Experiment", "Status", "Scope", "Started", "Assigned visits", "CVR lift", "Plan"], EXPS.map((e) => {
    const t = twoProp(e.assigned[1].b, e.assigned[1].s, e.assigned[0].b, e.assigned[0].s);
    return [`<button class="pill ${e.key === exp.key ? "active" : ""}" data-action="exp" data-key="${e.key}">${esc(e.name)}</button>`, e.status, esc(e.scope), e.start, int(e.assigned[0].s + e.assigned[1].s), lift(t), e.conditions[0].state === "met" ? `${e.conditions.filter((c) => c.state === "met").length} of ${e.conditions.length} parts` : `<span class="muted">observed only</span>`];
  }), { align: ["", "", "", "", "r", "r", ""] });
  const header = `
    <div class="${exp.mock ? "grid2" : ""}" style="align-items:start">
      <div class="stack tight">
        <h2>${esc(exp.name)}</h2>
        <p class="small muted">${esc(exp.key)} · ${exp.status} · started ${exp.start}${exp.planned_end ? ` · planned end ${exp.planned_end}` : ""}</p>
        <p>${esc(exp.hypothesis)}</p>
        <div class="row">${exp.arms.map((a) => `<span class="tag">${a.control ? "Control" : "Variant"}: ${esc(a.label)}${a.alloc != null ? ` · ${a.alloc * 100}%` : ""}</span>`).join("")}</div>
      </div>
      ${exp.mock ? heroMock() : ""}
    </div>`;
  const nav = `<div class="row">${tabs.map((t) => `<button class="pill ${t === state.tab ? "active" : ""}" data-action="tab" data-tab="${t}">${t}</button>`).join("")}</div>`;
  const body = { Insights: tabInsights, Site: tabSite, Segments: tabSegments, Page: tabPage, Funnel: tabFunnel, Journeys: tabJourneys, Sections: tabSections, Elements: tabElements, Plan: tabPlan, Data: tabData }[state.tab](exp);
  return `<div class="stack" style="gap:20px">${list}<div class="divider"></div>${header}${nav}${body}</div>`;
}

function tabInsights(exp) {
  const ins = buildInsights(exp);
  return `<div class="stack">
    <div class="panel-head"><p class="small muted" style="max-width:720px">Insight rules read the flat readout rows (Data tab) and fire when their condition holds. Each finding cites the row keys it read, so a person or an LLM can check every number.</p>${reqs(["R-INS-2", "R-INS-3", "R-INS-4"])}</div>
    <div class="grid2">${ins.map((i) => `
      <div class="ins">
        <div class="row" style="justify-content:space-between"><span class="sev sev-${i.sev}">${{ health: "Data health", warn: "Watch", effect: "Effect", locate: "Where", info: "Context" }[i.sev]}</span><code class="small">${i.rule}</code></div>
        <h3>${i.title}</h3>
        <div class="small">${i.finding}</div>
        ${i.evidence.length ? `<details><summary>Evidence: ${i.evidence.length} readout row${i.evidence.length > 1 ? "s" : ""}</summary><pre class="json" style="max-height:160px">${i.evidence.map(esc).join("\n")}</pre></details>` : ""}
      </div>`).join("")}
    </div>
  </div>`;
}

function tabSite(exp) {
  const [c, v] = exp.assigned;
  const cvr = twoProp(v.b, v.s, c.b, c.s);
  const rpvL = v.r / v.s / (c.r / c.s) - 1;
  const srm = srmP(c.s, v.s, exp.arms[0].alloc ?? 0.5);
  const days = dayLabels(exp.start, exp.days);
  const next = rng(seedOf(exp.key));
  const sess = exp.assigned.map((a) => spread(a.s, exp.days, next, 0.1));
  const buy = exp.assigned.map((a) => spread(a.b, exp.days, next, 0.25));
  const daily = exp.arms.map((_, i) => sess[i].map((s, d) => (buy[i][d] / s) * 100));
  let cs = [0, 0], cb = [0, 0];
  const cum = days.map((_, d) => { cs = [cs[0] + sess[0][d], cs[1] + sess[1][d]]; cb = [cb[0] + buy[0][d], cb[1] + buy[1][d]]; return ((cb[1] / cs[1]) / (cb[0] / cs[0]) - 1) * 100; });
  const bases = [["assigned", exp.assigned]].concat(exp.exposed ? [["exposed", exp.exposed]] : []);
  const rows = bases.flatMap(([basis, cells]) => exp.arms.map((arm, i) => {
    const a = cells[i], t = i === 0 ? null : twoProp(a.b, a.s, cells[0].b, cells[0].s);
    return [`<b>${esc(arm.label)}</b><br><span class="small muted">${arm.id}</span>`, basis, int(a.s), pct(a.s / (cells[0].s + cells[1].s)), int(a.b), pct(a.b / a.s, 2), t ? lift(t) : "—", t ? pfmt(t.p) : "—", t ? `${signed(t.lo)} … ${signed(t.hi)}` : "—", money(a.r / a.s), money(a.r / a.b)];
  }));
  return `<div class="stack">
    <div class="panel-head">
      <div class="stats">
        ${stat(signed(rpvL), `Revenue per visit · p ${pfmt(exp.rpv_p)} · causal`, (exp.rpv_p ?? 1) < 0.05 ? "good" : "")}
        ${stat(signed(cvr.lift), `Conversion · p ${pfmt(cvr.p)} · 95% CI ${signed(cvr.lo)} … ${signed(cvr.hi)}`, (cvr.p ?? 1) < 0.05 ? "good" : "")}
        ${stat(int(c.s + v.s), "Assigned visits")}
        ${stat(pfmt(srm), exp.arms[0].alloc == null ? "SRM p (assumes 50/50)" : "SRM p (declared 50/50)", srm < 0.01 ? "bad" : "")}
        ${stat(String(exp.days), exp.status === "running" ? "Days running" : "Days ran")}
      </div>
      ${reqs(["R-STAT-1", "R-STAT-2", "R-STAT-3", "R-ATT-1"])}
    </div>
    <div class="stack tight"><h3>Arms by basis</h3>
      ${table(["Arm", "Basis", "Visits", "Share", "Buyers", "CVR", "CVR lift", "p", "95% CI (lift)", "RPV", "AOV"], rows, { align: ["", "", "r", "r", "r", "r", "r", "r", "r", "r", "r"] })}
      ${caption("Assigned: every visit the testing tool tagged into the arm on the experiment's surface (causal). Exposed: assigned visits that viewed the tested page (conditionally causal). Bold green or red lifts are significant at p < 0.05.")}
    </div>
    <div class="grid2">
      <div class="stack tight"><h3>Cumulative conversion lift</h3>${lineChart({ categories: days, series: [{ name: `${exp.arms[1].label} vs control`, data: cum }], colors: ["var(--c-variant)"], ref: 0 })}${caption("Y: variant CVR ÷ control CVR − 1, cumulative (%) · X: day of experiment · dashed: no change")}</div>
      <div class="stack tight"><h3>Daily conversion rate by arm</h3>${lineChart({ categories: days, series: exp.arms.map((a, i) => ({ name: a.label, data: daily[i] })) })}${caption("Y: buyers ÷ assigned visits that day (%) · X: day. Daily rows (day_index) also feed the novelty-decay rule.")}</div>
    </div>
  </div>`;
}

function tabSegments(exp) {
  const seg = segmentAnalysis(exp);
  const rows = seg.rows.filter((r) => state.showExpl || r.planned);
  const forestRows = rows.map((r) => ({ label: `${r.label}: ${r.value}`, lift: r.test.lift, lo: r.test.lo, hi: r.test.hi, sig: r.adj < 0.05, planned: r.planned }));
  return `<div class="stack">
    <div class="panel-head">
      <p class="small muted" style="max-width:760px">Segments come only from what was known before assignment. <b>Planned</b> segments were declared in the experiment plan and are corrected together with Holm. <b>Exploratory</b> segments are corrected with Benjamini–Hochberg and labelled as hypotheses. Heterogeneity asks whether the lift differs between a strategy's values, which is a different question from "significant in one value and not another".</p>
      ${reqs(["R-SEG-1", "R-SEG-2", "R-SEG-3", "R-SEG-6", "R-SEG-7", "R-STAT-4", "R-STAT-5"])}
    </div>
    <label class="row small"><input type="checkbox" data-action="toggle-expl" ${state.showExpl ? "checked" : ""}> Show exploratory segments</label>
    <div class="grid2">
      <div class="stack tight"><h3>Conversion lift by segment, with 95% intervals</h3>${forest(forestRows)}${caption("Filled square: planned segment; hollow: exploratory. Green or red only when the corrected p < 0.05. X: relative CVR lift, variant vs control.")}</div>
      <div class="stack tight"><h3>Does the lift differ by segment?</h3>
        ${table(["Strategy", "Type", "Cochran's Q", "df", "Heterogeneity p", "Reading"], seg.het.map((h) => [h.label, h.planned ? `<span class="tag planned">planned</span>` : `<span class="tag expl">exploratory</span>`, h.q.toFixed(2), h.df, pfmt(h.p), h.p < 0.05 ? "The effect differs across values" : "No evidence the effect differs"]), { align: ["", "", "r", "r", "r", ""] })}
        ${caption("Q is computed on absolute CVR differences, weighted by inverse variance. With two values it equals the interaction z-test squared.")}
      </div>
    </div>
    <div class="stack tight"><h3>Segment readout</h3>
      ${table(["Segment", "Type", "Visits C / V", "CVR C → V", "CVR lift", "95% CI", "p", "Adjusted p", "RPV C → V", "RPV lift"], rows.map((r) => [
        `<b>${r.label}</b>: ${r.value}`, r.planned ? `<span class="tag planned">planned</span>` : `<span class="tag expl">exploratory</span>`, `${int(r.c.s)} / ${int(r.t.s)}`, `${pct(r.c.b / r.c.s, 2)} → ${pct(r.t.b / r.t.s, 2)}`, lift(r.test, r.adj), `${signed(r.test.lo)} … ${signed(r.test.hi)}`, pfmt(r.test.p), `${pfmt(r.adj)} <span class="small muted">${r.correction}</span>`, `${money(r.c.r / r.c.s)} → ${money(r.t.r / r.t.s)}`, signed(r.rpvLift),
      ]), { align: ["", "", "r", "r", "r", "r", "r", "r", "r", "r"], rowClass: rows.map((r) => (r.planned ? "" : "dim")) })}
      ${caption("Readout rows with level segment: one strategy and value per row. Values of one strategy partition the visits; summing across strategies double-counts by design.")}
    </div>
  </div>`;
}

function tabPage(exp) {
  return `<div class="stack">
    <div class="panel-head"><p class="small muted">Visits that viewed each declared page, by arm.</p>${reqs(["R-LVL-PAGE-1"])}</div>
    ${table(["Page", "Template", "Arm", "Visits", "Buyers", "CVR", "CVR lift", "p", "RPV"], exp.pages.flatMap((pg) => exp.arms.map((arm, i) => {
      const a = pg.cells[i], t = i === 0 ? null : twoProp(a.b, a.s, pg.cells[0].b, pg.cells[0].s);
      return [`<b>${pg.path}</b><br><span class="small muted">${pg.id}</span>`, pg.template, esc(arm.label), int(a.s), int(a.b), pct(a.b / a.s, 2), t ? lift(t) : "—", t ? pfmt(t.p) : "—", money(a.r / a.s)];
    })), { align: ["", "", "", "r", "r", "r", "r", "r", "r"] })}
    <div class="callout">Engine today: per-page cells are stored daily in <code>ae_experiment_row</code> (idsitehsr set), but the readout only sums them into the exposed basis. This table is the per-page readout to add.</div>
  </div>`;
}

function tabFunnel(exp) {
  const fa = funnelAnalysis(exp);
  const [c, v] = fa.reach;
  const last = fa.steps.length - 1;
  const e2e = twoProp(v[last], v[0], c[last], c[0]);
  return `<div class="stack">
    <div class="panel-head">
      <div class="stats">
        ${stat(signed(e2e.lift), `Assigned → purchased (ordered funnel) · p ${pfmt(e2e.p)}`, (e2e.p ?? 1) < 0.05 ? "good" : "")}
        ${fa.biggest ? stat(signed(fa.biggest.test.lift), `Largest step change: ${short(fa.biggest.from)} → ${short(fa.biggest.to)} · p ${pfmt(fa.biggest.test.p)}`, fa.biggest.test.lift > 0 ? "good" : "bad") : stat("—", "No step changed significantly")}
      </div>
      ${reqs(["R-LVL-FUN-1", "R-ATT-3", "R-SEG-3"])}
    </div>
    <div class="grid2">
      <div class="stack tight"><h3>Continuation rate at each step</h3>${barChart({ categories: fa.transitions.map((t) => `${short(t.from)} → ${short(t.to)}`), series: exp.arms.map((a, i) => ({ name: a.label, data: fa.transitions.map((t) => t.cont[i] * 100) })) })}${caption("Y: visits reaching the next step ÷ visits at the previous step (%) · X: step · descriptive")}</div>
      <div class="stack tight"><h3>Where the revenue-per-visit lift came from</h3>${diverging(fa.contributions)}${caption(`Log decomposition of the ${signed(fa.total - 1)} lift in revenue per visit along the ordered funnel path: each step's continuation ratio plus revenue per buyer. Contributions sum exactly to the total (percentage points).`)}</div>
    </div>
    <div class="stack tight"><h3>Funnel by arm</h3>
      ${table(["Step", "Control visits", "Variant visits", "Reach C → V", "Reach lift", "p", "Continuation C → V", "Continuation lift", "p"], fa.steps.map((step, i) => {
        const t = i === 0 ? null : fa.transitions[i - 1];
        return [step, int(c[i]), int(v[i]), i === 0 ? "100%" : `${pct(c[i] / c[0], 2)} → ${pct(v[i] / v[0], 2)}`, t ? lift(t.reachTest) : "—", t ? pfmt(t.reachTest.p) : "—", t ? `${pct(t.cont[0])} → ${pct(t.cont[1])}` : "—", t ? lift(t.test) : "—", t ? pfmt(t.test.p) : "—"];
      }), { align: ["", "r", "r", "r", "r", "r", "r", "r", "r"], rowClass: fa.steps.map((_, i) => (fa.biggest && fa.biggest.i === i ? "hl" : "")) })}
      ${caption("Reach: share of assigned visits that reached the step after every earlier one (causal). Continuation: share of the previous step's visits (descriptive). Steps come from journey_events_map and orders, joined to the arm's assigned visits.")}
    </div>
    <div class="callout">Engine today: experiment rows carry checkout started and purchase per arm. The other steps exist per visit in <code>journey_events_map</code>, and <code>funnel-sequence-weekly</code> orders them per site, but not per arm.</div>
  </div>`;
}

function tabJourneys(exp) {
  const j = exp.journey, na = j.next_after;
  const tot = j.clusters.reduce((a, cl) => [a[0] + cl.s[0], a[1] + cl.s[1]], [0, 0]);
  const flow = (arm) => {
    const links = j.clusters.map((cl) => ({ from: j.entry, to: cl.page, value: cl.s[arm], tone: cl.page.startsWith("Exit") ? "muted" : "accent" }));
    j.clusters.filter((cl) => !cl.page.startsWith("Exit")).forEach((cl) => { links.push({ from: cl.page, to: "Purchased", value: cl.b[arm], tone: "good" }); links.push({ from: cl.page, to: "Did not buy", value: cl.s[arm] - cl.b[arm], tone: "muted" }); });
    return sankey([[j.entry], j.clusters.map((cl) => cl.page), ["Purchased", "Did not buy"]], links);
  };
  return `<div class="stack">
    <div class="panel-head"><p class="small muted" style="max-width:720px">Visitors who viewed ${j.entry.toLowerCase()}: where they went next, whether they bought, where the tested CTA sent them, and how often they bounced back.</p>${reqs(["R-LVL-JRN-1", "R-LVL-JRN-2", "R-LVL-EL-1"])}</div>
    <div class="stack tight"><h3>${j.entry} visitors: second page, then purchase</h3>
      <div class="grid2">${exp.arms.map((a, i) => `<div class="stack tight"><p class="small"><b>${esc(a.label)}</b></p>${flow(i)}</div>`).join("")}</div>
      ${caption("Band width: visits. Green bands are buyers.")}
    </div>
    <div class="grid2">
      <div class="stack tight"><h3>Where ${na.label} clickers went next</h3>${stacked100({ categories: exp.arms.map((a) => a.label), series: na.dest.map((d, k) => ({ name: d, data: na.counts.map((row) => row[k]) })), colors: ["var(--c-variant)", "var(--c3)", "var(--c5)", "var(--c4)", "var(--c6)"] })}${caption(`Share of visits that clicked the role-paired ${na.label} (control: the hero image link; variant: the button). Descriptive.`)}</div>
      <div class="stack tight"><h3>Second page after ${j.entry.toLowerCase()}</h3>
        ${table(["Next page", "Share C → V", "Lift", "p", "Path CVR C → V"], j.clusters.map((cl) => {
          const t = twoProp(cl.s[1], tot[1], cl.s[0], tot[0]);
          return [cl.page, `${pct(cl.s[0] / tot[0])} → ${pct(cl.s[1] / tot[1])}`, lift(t, null, { lowerIsBetter: cl.page.startsWith("Exit") }), pfmt(t.p), cl.b[0] + cl.b[1] ? `${pct(cl.b[0] / cl.s[0], 2)} → ${pct(cl.b[1] / cl.s[1], 2)}` : "—"];
        }), { align: ["", "r", "r", "r", "r"] })}
      </div>
    </div>
    <div class="stack tight"><h3>Journey behaviors</h3>
      ${table(["Behavior", "Control", "Variant", "Lift", "p"], j.flags.map((f) => { const t = twoProp(f.count[1], tot[1], f.count[0], tot[0]); return [f.label, pct(f.count[0] / tot[0]), pct(f.count[1] / tot[1]), lift(t, null, { lowerIsBetter: f.lower_is_better }), pfmt(t.p)]; }), { align: ["", "r", "r", "r", "r"] })}
      ${caption(`Share of ${j.entry.toLowerCase()} visitors with each journey flag (journey-weekly definitions). For U-turns and quick backs, lower is better.`)}
    </div>
  </div>`;
}

function tabSections(exp) {
  const sa = sectionAnalysis(exp);
  const assigned = exp.assigned.map((a) => a.s);
  return `<div class="stack">
    <div class="panel-head">
      <div class="stats">
        ${exp.arms.map((a, i) => stat(pct(exp.captured[i] / assigned[i], 2), `${esc(a.label)}: ${int(exp.captured[i])} visits captured`)).join("")}
        ${stat(pfmt(sa.capTest.p), "Capture balance p", sa.balanced ? "" : "bad")}
      </div>
      ${reqs(["R-ATT-2", "R-CAP-1", "R-CAP-3", "R-LVL-SEC-1", "R-LVL-SEC-2"])}
    </div>
    ${sa.balanced ? "" : `<div class="callout warn">The section tracker captured the arms at different rates. Every section comparison below is shown greyed out: the captured visitors are not the same kind of visitor in both arms.</div>`}
    <div class="grid2">
      <div class="stack tight"><h3>Seen rate by section</h3>${barChart({ categories: exp.sections.map((s) => s.section), series: exp.arms.map((a, i) => ({ name: a.label, data: exp.sections.map((s) => (s.seen[i] / exp.captured[i]) * 100) })) })}${caption("Y: captured visits with the section ≥ 50% visible for 1 s (%) · X: rollup section")}</div>
      <div class="stack tight"><h3>Click rate by section</h3>${barChart({ categories: exp.sections.map((s) => s.section), series: exp.arms.map((a, i) => ({ name: a.label, data: exp.sections.map((s) => (s.clicked[i] / exp.captured[i]) * 100) })) })}${caption("Y: captured visits that clicked anywhere inside the section (%) · X: rollup section")}</div>
    </div>
    <div class="stack tight"><h3>Rollup sections, variant vs control</h3>
      ${table(["Section", "Role", "Seen C → V", "Seen lift", "p", "Clicked C → V", "Click lift", "p", "Seen-visitor CVR", "Comparable"], sa.rows.map(({ s, seenT, clickT, cvrT, comparable }) => [
        `<b>${s.section}</b>`, s.role ? `<span class="tag ${s.role}">${s.role}</span>` : `<span class="tag expl">auto</span>`, `${pct(seenT.p0)} → ${pct(seenT.p1)}`, sa.balanced ? lift(seenT) : `<span class="muted">${signed(seenT.lift)}</span>`, pfmt(seenT.p), `${pct(clickT.p0)} → ${pct(clickT.p1)}`, sa.balanced ? lift(clickT) : `<span class="muted">${signed(clickT.lift)}</span>`, pfmt(clickT.p), comparable ? `${pct(cvrT.p0, 2)} → ${pct(cvrT.p1, 2)} (${signed(cvrT.lift)})` : `<span class="muted">${pct(cvrT.p0, 2)} → ${pct(cvrT.p1, 2)}</span>`, comparable ? "yes" : `<span class="warn">no: ${sa.balanced ? "seen rate differs" : "capture differs"}</span>`,
      ]), { align: ["", "", "r", "r", "r", "r", "r", "r", "r", ""], rowClass: sa.rows.map((r) => (r.s.role === "treated" ? "hl" : "")) })}
      ${caption("Base: captured visits (a sample, about 4% of assigned visits on the measured store). Seen and click rates are conditionally causal when capture is balanced. Seen-visitor conversion is descriptive and is shown only when the audiences match.")}
    </div>
  </div>`;
}

function tabElements(exp) {
  const assigned = exp.assigned.map((a) => a.s);
  const pairs = rolePairs(exp);
  const label = (e) => e.name || e.selector.split(" ").slice(-1)[0];
  return `<div class="stack">
    <div class="panel-head"><p class="small muted" style="max-width:720px">Element rows read every click, so the base is every assigned visit. Selectors drop Shopify's per-publish template ids so both arms share one key. An element that is different in each arm is compared by its <b>role</b>, declared in the extension.</p>${reqs(["R-LVL-EL-1", "R-EXT-6", "R-UI-4", "R-ATT-4"])}</div>
    ${pairs.map((rp) => `
      <div class="card stack tight">
        <div class="row" style="justify-content:space-between"><h3>Role <code>${rp.role}</code>, paired across arms</h3><span class="small muted">${rp.members.map((m) => `${exp.arms[m.only_arm ?? 0].label}: <code>${esc(m.selector.split(" ").slice(-3).join(" "))}</code>`).join(" · ")}</span></div>
        <div class="stats">${stat(`${pct(rp.test.p0)} → ${pct(rp.test.p1)}`, "Visits that clicked it")}${stat(signed(rp.test.lift), `Click lift · p ${pfmt(rp.test.p)} · 95% CI ${signed(rp.test.lo)} … ${signed(rp.test.hi)}`, (rp.test.p ?? 1) < 0.05 ? "good" : "")}${stat(`${pct(rp.cvr[0])} → ${pct(rp.cvr[1])}`, "Clicker conversion (descriptive)")}</div>
      </div>`).join("")}
    <div class="stack tight"><h3>Click rate by element</h3>${barChart({ categories: exp.elements.map(label), series: exp.arms.map((a, i) => ({ name: a.label, data: exp.elements.map((e) => (e.clickers[i] / assigned[i]) * 100) })), horizontal: true, decimals: 2, width: 1100 })}${caption("X: assigned visits that clicked the element (%) · a zero bar means the element does not exist in that arm")}</div>
    <div class="stack tight"><h3>Elements, variant vs control</h3>
      ${table(["Element", "Class · role", "Section", "Clicked C → V", "Click lift", "p", "Clicks per clicker", "Clicker CVR"], exp.elements.map((e) => {
        const t = twoProp(e.clickers[1], assigned[1], e.clickers[0], assigned[0]);
        const single = e.only_arm != null || e.clickers[0] === 0;
        return [`${e.name ? `<b>${esc(e.name)}</b><br>` : ""}<span class="sel">${esc(e.selector)}</span>${single ? `<br><span class="small warn">only in ${esc(exp.arms[e.only_arm ?? 1].label)}</span>` : ""}`, `${e.cls || '<span class="muted">unclassed</span>'}${e.role ? ` · <code>${e.role}</code>` : ""}`, e.section || '<span class="muted">none</span>', `${pct(e.clickers[0] / assigned[0], 2)} → ${pct(e.clickers[1] / assigned[1], 2)}`, single ? `<span class="muted">${signed(t.lift)}</span>` : lift(t), single ? "—" : pfmt(t.p), `${e.clickers[0] ? (e.clicks[0] / e.clickers[0]).toFixed(2) : "—"} → ${e.clickers[1] ? (e.clicks[1] / e.clickers[1]).toFixed(2) : "—"}`, `${pct(rate(e.b[0], e.clickers[0]))} → ${pct(rate(e.b[1], e.clickers[1]))}`];
      }), { align: ["", "", "", "r", "r", "r", "r", "r"], rowClass: exp.elements.map((e) => (e.only_arm != null || e.clickers[0] === 0 ? "dim" : "")) })}
    </div>
  </div>`;
}

function tabPlan(exp) {
  const feas = exp.planned_end ? feasibility(exp, state.mde, state.alpha, state.power) : [];
  const story = [
    ["Open A/B comparison", "Filter → A/B → Compare → A/B. Two windows open side by side, each loading its arm's version of the page. Same experiment id in both panes = experiment mode."],
    ["Confirm the panes", "Panes are labelled Control and Variant from the engine's observed descriptor; the user confirms or swaps."],
    ["Experiment details", "Name, hypothesis, primary metric, guardrails, page, dates, allocations, planned segments, minimum detectable effect."],
    ["Flag zones", "Right-click → Edit on the hero section → Rollup zone on → Include in experiment. It becomes a treated zone, and its image is captured in both panes."],
    ["Flag elements with a role", "Right-click the control's hero image and the variant's button → Include → role \"Hero CTA\". The arm is filled in from the pane."],
    ["Save the plan", "An experiment-v1 package is saved and versioned. The next site analysis reads it; zones are published to the tracker."],
  ];
  return `<div class="stack">
    <div class="panel-head"><p class="small muted" style="max-width:720px">The plan is made in the Heatmap Chrome extension's A/B comparison mode, before results exist. Planned segments are declared here, with a feasibility check from the site's baselines.</p>${reqs(["R-EXT-1", "R-EXT-5", "R-EXT-6", "R-EXT-8", "R-SEG-4", "R-SEG-5"])}</div>
    <div class="story">${story.map(([t, d]) => `<div class="card stack tight"><h3 style="display:inline">${t}</h3><p class="small">${d}</p></div>`).join("")}</div>
    ${exp.planned_end ? `
    <div class="stack tight">
      <div class="panel-head"><h3>Planned segments: can the test detect the effect by ${exp.planned_end}?</h3>
        <div class="row small">
          <label>MDE <input type="range" min="0.03" max="0.3" step="0.01" value="${state.mde}" data-action="mde"> <b>${Math.round(state.mde * 100)}%</b> relative</label>
          <label>α <select data-action="alpha">${[0.05, 0.1].map((a) => `<option ${state.alpha === a ? "selected" : ""}>${a}</option>`).join("")}</select></label>
          <label>Power <select data-action="power">${[0.8, 0.9].map((p) => `<option ${state.power === p ? "selected" : ""}>${p}</option>`).join("")}</select></label>
        </div>
      </div>
      ${table(["Segment", "MDE", "Baseline CVR", "Visits per arm per day", "Needed per arm", "Days needed", "Planned days", "Status"], feas.map((f) => [f.label, `${Math.round(f.mde * 100)}%${f.declaredMde ? ' <span class="small muted">declared</span>' : ""}`, pct(f.p, 2), int(f.daily), int(f.n), String(f.daysNeeded), String(f.plannedDays), f.status === "feasible" ? `<span class="good">feasible</span>` : `<span class="${f.status.startsWith("needs") ? "warn" : "bad"}">${f.status}</span>`]), { align: ["", "r", "r", "r", "r", "r", "r", ""] })}
      ${caption("n = (z₁₋α/₂ + z₁₋β)² · 2p(1−p) / (p · MDE)², from the site's baseline conversion per segment. In production the baselines come from the site's last 28 days before launch; here they are the control arm's rates.")}
    </div>` : `<div class="callout warn">This experiment has no plan, so there are no planned segments, no feasibility check and no planned end. Every segment is exploratory.</div>`}
    <div class="grid2">
      <div class="stack tight"><h3>Definition parts and what each adds</h3>${table(["Part", "State", "What it adds"], exp.conditions.map((c) => [c.label, c.state === "met" ? `<span class="good">met</span>` : c.state === "missing" ? `<span class="warn">missing</span>` : `<span class="muted">n/a</span>`, c.adds]))}</div>
      <div class="stack tight"><h3>Descriptor</h3><pre class="json">${esc(JSON.stringify(exp.descriptor, null, 2))}</pre>${caption("Selectors are stored as captured; the engine strips Shopify template ids when matching clicks. Zone images are stored by reference.")}</div>
    </div>
  </div>`;
}

function tabData(exp) {
  const all = buildReadout(exp);
  const levels = ["all", ...new Set(all.map((r) => r.level))];
  const rows = all.filter((r) => state.dataLevel === "all" || r.level === state.dataLevel);
  const cols = ["level", "entity_key", "entity_role", "basis", "metric", "segment", "segment_value", "segment_planned", "value", "control_value", "lift_rel", "ci_low_rel", "ci_high_rel", "p_value", "p_adjusted", "causal_class", "comparable"];
  const fmt = (v) => (v == null ? '<span class="muted">null</span>' : typeof v === "number" ? String(v) : esc(Array.isArray(v) ? JSON.stringify(v) : v));
  const jsonl = rows.map((r) => JSON.stringify(r)).join("\n");
  return `<div class="stack">
    <div class="panel-head">
      <p class="small muted" style="max-width:760px">The flat readout contract: one metric per row, with canonical identities, base, causal class, planned flag, corrections and provenance. This is what the site-analysis engine and AI analysts read through MCP or JSONL. Rows are generated in this page from the embedded counts.</p>
      ${reqs(["R-DATA-2", "R-DATA-3", "R-DATA-4", "R-ATT-1", "R-INS-5"])}
    </div>
    <div class="row small">
      <label>Level <select data-action="data-level">${levels.map((l) => `<option ${state.dataLevel === l ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <span class="muted">${rows.length} rows</span>
      <button class="btn" data-action="copy">Copy JSONL</button>
      <button class="btn" data-action="download">Download JSONL</button>
    </div>
    ${table(cols, rows.map((r) => cols.map((c) => (c === "entity_key" ? `<span class="sel" style="white-space:nowrap;word-break:normal">${fmt(r[c])}</span>` : fmt(r[c])))), { align: cols.map((c) => (["value", "control_value", "lift_rel", "ci_low_rel", "ci_high_rel", "p_value", "p_adjusted"].includes(c) ? "r" : "")) })}
    <div class="stack tight"><h3>JSON Lines (first 12 rows of this filter)</h3><pre class="json">${esc(rows.slice(0, 12).map((r) => JSON.stringify(r)).join("\n"))}</pre></div>
    <textarea id="jsonl" style="position:absolute;left:-9999px">${esc(jsonl)}</textarea>
  </div>`;
}

// ------------------------------------------------------------------ render and events
function render() {
  document.getElementById("mainnav").innerHTML = ["vision", "dashboard"].map((v) => `<button class="pill ${state.view === v ? "active" : ""}" data-action="view" data-view="${v}">${v === "vision" ? "Vision & requirements" : "Dashboard"}</button>`).join("");
  document.getElementById("app").innerHTML = state.view === "vision" ? viewVision() : viewDashboard();
}
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "view") state.view = el.dataset.view;
  else if (a === "exp") { state.exp = el.dataset.key; }
  else if (a === "tab") state.tab = el.dataset.tab;
  else if (a === "goto") { state.view = "dashboard"; state.tab = el.dataset.tab; }
  else if (a === "copy") { const t = document.getElementById("jsonl"); navigator.clipboard?.writeText(t.value); el.textContent = "Copied"; return; }
  else if (a === "download") {
    const blob = new Blob([document.getElementById("jsonl").value], { type: "application/x-ndjson" });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `${current().key.replace(/[^a-z0-9]+/gi, "-")}-readout.jsonl`; link.click(); return;
  } else return;
  render();
  if (a === "goto" || a === "view") window.scrollTo(0, 0);
});
document.addEventListener("change", (ev) => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "mde") state.mde = Number(el.value);
  else if (a === "alpha") state.alpha = Number(el.value);
  else if (a === "power") state.power = Number(el.value);
  else if (a === "toggle-expl") state.showExpl = el.checked;
  else if (a === "data-level") state.dataLevel = el.value;
  else if (a === "req-area") state.reqArea = el.value;
  else if (a === "req-status") state.reqStatus = el.value;
  else return;
  render();
});
render();
</script>
</body>
</html>
