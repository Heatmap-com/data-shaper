<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis query tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 id="title">Analysis query tool</h1>
      <span class="tag">ChatGPT - V1</span>
      <a class="revisions-link" href="../../">All revisions</a>
    </div>
    <div class="selectors">
      <label class="picker"><span>Site</span><select id="site-select"></select></label>
      <label class="picker wide"><span>Question</span><select id="tab-select"></select></label>
      <button id="glossary-open" type="button">Definitions</button>
    </div>
    <p id="meta" class="meta"></p>
    <p id="snap-banner" class="snap-banner" hidden></p>
    <div id="context-bar" class="context-bar"></div>
  </header>

  <main>
    <div class="tab-head">
      <h2 id="tab-title"></h2>
      <p id="tab-intro"></p>
    </div>
    <div class="layout">
      <div id="panels"></div>
      <aside id="verdicts" hidden></aside>
    </div>
  </main>

  <div id="glossary" class="drawer" hidden>
    <div class="drawer-inner">
      <header><h3>Definitions</h3><button id="glossary-close" type="button">Close</button></header>
      <div id="glossary-body"></div>
    </div>
  </div>
  <aside id="evidence" class="evidence" hidden></aside>
  <div id="facilitator" class="facilitator" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
